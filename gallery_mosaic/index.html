<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{padding:0;margin:0;background:transparent;font:13px system-ui,-apple-system,sans-serif;color:#25303b}
.hint{display:flex;gap:8px;align-items:center;color:#748292;font-size:12px;margin:2px 3px 12px}
.hint svg{width:15px;height:15px}
#mosaic{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-auto-rows:8px;gap:12px;align-items:start}
.tile{grid-row-end:span 20;cursor:grab;border:1px solid #d4dce4;border-radius:12px;background:#e9eef3;position:relative;box-shadow:0 3px 12px rgba(20,31,45,.08);overflow:hidden;min-width:0;user-select:none;outline:0;transition:box-shadow .15s,border-color .15s,opacity .15s}
.tile:focus-visible{outline:3px solid #246edc;outline-offset:2px}
.tile:hover{box-shadow:0 6px 22px rgba(17,35,55,.19);border-color:#9ab1d1}
.tile img{width:100%;height:auto;display:block;pointer-events:none}
.tile img.placeholder{height:160px;object-fit:cover}
.tile .meta{padding:10px 12px;background:#fff;line-height:1.35}
.tile .name{font-size:12px;font-weight:600;overflow-wrap:anywhere}
.tile .date{font-size:11px;color:#6d7a88;margin-top:4px}
.tile .handle{position:absolute;top:8px;right:8px;background:rgba(26,35,47,.67);color:white;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:700;pointer-events:none}
.tile.dragging{opacity:.33}
.tile.drop-target{outline:3px solid #2074e6;outline-offset:-3px}
#message{min-height:1px}
@media(max-width:500px){#mosaic{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile .meta{padding:7px}}
</style></head><body>
<div class="hint"><span>⠿</span><span>Перетащите снимки, чтобы изменить порядок. Нажмите на карточку для редактирования.</span></div>
<div id="mosaic" aria-label="Галерея снимков"></div><div id="message"></div>
<script>
'use strict';
let lastRevision='',selectedDragging='',suppressClick=false,eventCounter=0;
const mosaic=document.getElementById('mosaic');
function eventId(){return String(Date.now())+'-'+(++eventCounter);}
function emit(action,payload){
  window.parent.postMessage({
    isStreamlitMessage:true,type:'streamlit:setComponentValue',
    value:{action:action,...payload,event_id:eventId()},dataType:'json'
  },'*');
}
let resizePending=false;
function layout(){
  if(resizePending)return;
  resizePending=true;
  requestAnimationFrame(()=>{
    resizePending=false;
    const row=8,gap=12;
    for(const tile of mosaic.children){
      const img=tile.querySelector('img'),caption=tile.querySelector('.meta');
      const available=tile.clientWidth;
      const ratio=(img&&img.naturalWidth&&img.naturalHeight)
        ?img.naturalHeight/img.naturalWidth : .66;
      const height=available*ratio+(caption?caption.offsetHeight:0)+2;
      tile.style.gridRowEnd='span '+Math.max(7,Math.ceil((height+gap)/(row+gap)));
    }
    window.parent.postMessage({
      isStreamlitMessage:true,type:'streamlit:setFrameHeight',
      height:Math.ceil(document.documentElement.scrollHeight)+12
    },'*');
  });
}
function render(photos){
  mosaic.replaceChildren();
  for(const photo of photos){
    const tile=document.createElement('article');
    tile.className='tile';tile.draggable=true;tile.tabIndex=0;tile.dataset.id=photo.id;
    tile.title='Перетащить для изменения порядка; нажать для открытия';
    const image=document.createElement('img');
    image.draggable=false;image.loading='eager';image.alt=photo.title||'Снимок карты';
    image.src=photo.thumbnail || '';
    image.onload=layout;
    if(!photo.thumbnail)image.className='placeholder';
    const caption=document.createElement('div');caption.className='meta';
    const name=document.createElement('div');name.className='name';
    name.textContent=photo.title||'Без названия';
    const date=document.createElement('div');date.className='date';
    date.textContent=photo.source_date ? 'Съёмка: '+photo.source_date : 'Дата съёмки не указана';
    caption.append(name,date);
    const handle=document.createElement('span');handle.className='handle';
    handle.textContent='⠿';
    tile.append(image,caption,handle);
    tile.addEventListener('click',()=>{
      if(suppressClick)return;
      emit('select',{image_id:photo.id});
    });
    tile.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();emit('select',{image_id:photo.id});
      }
    });
    tile.addEventListener('dragstart',e=>{
      selectedDragging=photo.id;tile.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',photo.id);
    });
    tile.addEventListener('dragend',()=>{
      selectedDragging='';tile.classList.remove('dragging');
      mosaic.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
    });
    tile.addEventListener('dragover',e=>{
      if(!selectedDragging||selectedDragging===photo.id)return;
      e.preventDefault();e.dataTransfer.dropEffect='move';
      tile.classList.add('drop-target');
    });
    tile.addEventListener('dragleave',()=>tile.classList.remove('drop-target'));
    tile.addEventListener('drop',e=>{
      e.preventDefault();
      tile.classList.remove('drop-target');
      const moved=selectedDragging||e.dataTransfer.getData('text/plain');
      if(!moved||moved===photo.id)return;
      const ids=Array.from(mosaic.children).map(x=>x.dataset.id);
      const from=ids.indexOf(moved),to=ids.indexOf(photo.id);
      if(from<0||to<0)return;
      ids.splice(from,1);ids.splice(to,0,moved);
      const dragTile=Array.from(mosaic.children).find(x=>x.dataset.id===moved);
      if(dragTile) {
        // Rebuild the DOM immediately so the user sees the new position even
        // while Streamlit synchronizes the persisted ordering.
        const before=Array.from(mosaic.children).find(x=>x.dataset.id===ids[to+1]);
        mosaic.insertBefore(dragTile,before||null);
      }
      suppressClick=true;window.setTimeout(()=>{suppressClick=false;},150);
      layout();
      emit('reorder',{ids:ids});
    });
    mosaic.append(tile);
  }
  layout();
}
window.addEventListener('message',event=>{
  if(!event.data||event.data.type!=='streamlit:render')return;
  const args=event.data.args||{};
  const revision=String(args.revision||'');
  if(revision===lastRevision)return;
  lastRevision=revision;
  render(Array.isArray(args.photos)?args.photos:[]);
});
if('ResizeObserver' in window)new ResizeObserver(layout).observe(mosaic);
window.addEventListener('resize',layout);
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></body></html>
