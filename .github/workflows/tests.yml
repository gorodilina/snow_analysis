name: Validate snow_analysis
on:
  push:
    branches:
      - feature/shareable-research-sessions
      - feature/user-photos-delete-geotiff-2026-11-18
  pull_request:
    branches:
      - main
      - feature/shareable-research-sessions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q app.py gee_client.py geo_utils.py gallery_clipboard.py map_builder.py map_component.py session_store.py project_layers.py project_archive.py gallery.py gallery_editor.py gallery_mosaic.py gallery_uploads.py geo_export.py project_delete.py tests
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Smoke-test Streamlit application
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=30).run()
          if len(app.exception):
              for error in app.exception:
                  print(error.message)
              raise AssertionError("Streamlit app raised exceptions")
          print("AppTest passed without GEE/Supabase credentials")
          PY
      - name: Validate map JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          for filename,target in [
              ('map_component/index.html','/tmp/snow_map.js'),
              ('gallery_editor/index.html','/tmp/snow_gallery_editor.js'),
              ('gallery_mosaic/index.html','/tmp/snow_gallery_mosaic.js'),
          ]:
              s=pathlib.Path(filename).read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
              scripts=[script for script in scripts if script.strip()]
              assert len(scripts)==1, (filename,len(scripts))
              pathlib.Path(target).write_text(scripts[0])
          PY
          node --check /tmp/snow_map.js
          node --check /tmp/snow_gallery_editor.js
          node --check /tmp/snow_gallery_mosaic.js
