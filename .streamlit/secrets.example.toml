# Copy to .streamlit/secrets.toml for local Streamlit.
# Never commit private keys or the real secrets.toml file.
GEE_PROJECT = "your-google-cloud-project-id"

# For Streamlit Community Cloud use a valid JSON service-account key as a secret:
# GEE_SERVICE_ACCOUNT = '''{"type":"service_account",...}'''
# Or provide nested secrets:
# [gee_service_account]
# type = "service_account"
# project_id = "..."
# private_key_id = "..."
# private_key = "-----BEGIN PRIVATE KEY-----\\n...\\n-----END PRIVATE KEY-----\\n"
# client_email = "service-account@your-project.iam.gserviceaccount.com"
